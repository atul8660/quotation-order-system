<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quotation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass login-box">
            <p style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.5rem;">Q2O System</p>
            <h2>Sign in to your account</h2>
            <p style="margin-top: 0.25rem;">Quotation to Order System</p>
            
            <div id="errorMsg" class="alert alert-error"></div>

            <form id="loginForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            

        </div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
