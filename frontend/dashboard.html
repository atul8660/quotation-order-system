<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quotation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span>Q2O System</span>
            <h2>Quotation to Order</h2>
        </div>
        <nav class="sidebar-nav" id="navLinks">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="customers.html">Customers</a>
            <a href="products.html">Products</a>
            <a href="quotations.html">Quotations</a>
            <a href="orders.html">Orders</a>
            <a href="users.html" id="nav-users" style="display: none;">Users</a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">--</div>
                <div>
                    <div class="user-name" id="sidebarUserName">User</div>
                    <div class="user-role" id="sidebarUserRole">Role</div>
                </div>
            </div>
            <button onclick="logout()" class="btn btn-ghost" style="width: 100%; font-size: 0.8rem;">Sign Out</button>
        </div>
    </aside>
    <div class="main-content">
    

    <div class="container">
        <div class="page-header">
            <h1 id="dashboardTitle">Dashboard</h1>
            <p id="dashboardSubtitle" class="greeting"></p>
        </div>
        
        <div class="grid">
            <div class="glass stat-card" id="card-customers">
                <p>Total Customers</p>
                <h3 id="stat-customers">0</h3>
            </div>
            <div class="glass stat-card" id="card-products">
                <p>Total Products</p>
                <h3 id="stat-products">0</h3>
            </div>
            <div class="glass stat-card" id="card-quotations">
                <p>Total Quotations</p>
                <h3 id="stat-quotations">0</h3>
            </div>
            <div class="glass stat-card" id="card-pending">
                <p>Pending Approvals</p>
                <h3 id="stat-pending">0</h3>
            </div>
            <div class="glass stat-card" id="card-accepted">
                <p>Accepted Quotes</p>
                <h3 id="stat-accepted">0</h3>
            </div>
            <div class="glass stat-card" id="card-orders">
                <p>Total Orders</p>
                <h3 id="stat-orders">0</h3>
            </div>
        </div>
    </div>
    </div>

    
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
